name: App
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  app-checks:
    name: app-checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint checks
        run: npm run lint

      - name: Run Typescript type checks
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

        # Only the build catches a server-only module imported by a client component.
      - name: Build
        run: npm run build
